<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فريقي - Rolex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body{background:#0d0221;color:white;font-family:sans-serif;}</style>
</head>
<body class="p-6 pb-24">
    <h1 class="text-2xl font-black mb-8">إحصائيات الفريق 👥</h1>
    <div id="teamList" class="space-y-4">
        <p class="text-center text-gray-600 py-10">جاري تحميل أعضاء فريقك...</p>
    </div>
    <div class="fixed bottom-6 left-6 right-6 bg-[#1a0b3c]/80 backdrop-blur-lg p-4 rounded-[2rem] flex justify-around border border-white/5 shadow-2xl">
        <a href="index.html" class="text-gray-500 text-xs font-bold">🏠 الرئيسية</a>
        <a href="team.html" class="text-purple-400 text-xs font-bold">👥 الفريق</a>
        <a href="kyc.html" class="text-gray-500 text-xs font-bold">🛡️ التوثيق</a>
    </div>
    <script>
        const supabaseClient = supabase.createClient('https://ddjpdiatyrgcdcjbvptn.supabase.co', 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkanBkaWF0eXJnZGNqYnZwdHluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxMTkwNzEsImV4cCI6MjA5MDY5NTA3MX0.YVdo6jmzyp3_AKEVD2L4RCqPr0AfDI6-mwkX0hhVKbg');
        async function loadTeam() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const { data } = await supabaseClient.from('profiles').select('email, uid').eq('referrer_id', user.id);
            const container = document.getElementById('teamList'); container.innerHTML = '';
            if(data && data.length > 0) {
                data.forEach(m => {
                    container.innerHTML += `<div class="bg-[#1a0b3c] p-4 rounded-2xl border border-white/5 flex justify-between items-center shadow-md">
                        <span class="text-xs font-bold">${m.email}</span><span class="text-[10px] bg-purple-900/30 px-2 py-1 rounded text-purple-400">UID: ${m.uid}</span>
                    </div>`;
                });
            } else { container.innerHTML = '<p class="text-center text-gray-700 mt-20">لا يوجد أعضاء في فريقك حالياً</p>'; }
        }
        loadTeam();
    </script>
</body>
</html>
